name: Build Wisp Executables (Windows, macOS, Ubuntu & Fedora Linux)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows-x64
            dist_script: dist:win
          - os: macos-latest
            platform_name: macOS
            dist_script: dist:mac
          - os: ubuntu-latest
            platform_name: Linux-Ubuntu-and-Fedora
            dist_script: dist:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Packaging Tools (Ubuntu .deb/.AppImage & Fedora .rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libfuse2 libsndfile1 pulseaudio-utils

      - name: Install Python Backend Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Bundle Python Local AI Backend with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --name wisp-backend --distpath backend-dist --workpath backend-build --paths backend --collect-all sherpa_onnx --collect-all onnxruntime --collect-all sentencepiece --collect-all tokenizers --collect-all soundfile --collect-all soundcard --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on backend/main.py

      - name: Install Frontend & Electron Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend & Package Desktop Executables
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.dist_script }}

      - name: Upload Built Executables Artifact (${{ matrix.platform_name }})
        uses: actions/upload-artifact@v4
        with:
          name: Wisp-${{ matrix.platform_name }}
          path: |
            frontend/release/*.exe
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/*.deb
            frontend/release/*.rpm
            frontend/release/*.AppImage
          if-no-files-found: warn

  release:
    name: Publish GitHub Release (on tag v*)
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release with Windows, macOS, Ubuntu & Fedora Installers
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
