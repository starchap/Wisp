name: Build Wisp Executables (Windows, macOS, Ubuntu & Fedora Linux)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-desktop:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows-x64
            dist_script: dist:win
          - os: macos-latest
            platform_name: macOS
            dist_script: dist:mac
          - os: ubuntu-22.04
            platform_name: Linux-Ubuntu-and-Fedora
            dist_script: dist:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Packaging Tools (Ubuntu .deb/.AppImage & Fedora .rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libfuse2 libsndfile1 pulseaudio-utils

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Bundle Signed Python Runtime & AI Backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "
          import pathlib, shutil, sys
          src = pathlib.Path(sys.base_prefix)
          dst = pathlib.Path('backend-dist/python')
          shutil.rmtree(dst, ignore_errors=True)
          dst.mkdir(parents=True, exist_ok=True)
          for pattern in ('python.exe', 'pythonw.exe', 'python3*.dll', 'vcruntime*.dll'):
              for f in src.glob(pattern):
                  shutil.copy2(f, dst / f.name)
          shutil.copytree(
              src / 'DLLs',
              dst / 'DLLs',
              ignore=shutil.ignore_patterns('_tkinter*', 'tcl*', 'tk*', '*.pdb')
          )
          shutil.copytree(
              src / 'Lib',
              dst / 'Lib',
              ignore=shutil.ignore_patterns(
                  '__pycache__', '*.pyc', 'test', 'tests', 'tkinter', 'idlelib',
                  'turtledemo', 'ensurepip', 'lib2to3', 'pydoc_data', 'distutils',
                  'pip', 'pip-*', 'setuptools', 'setuptools-*', 'wheel', 'wheel-*',
                  'pkg_resources', 'pydantic_core*', 'watchfiles*', 'httptools*',
                  'yaml*', 'PyYAML*', 'huggingface_hub*', 'hf_xet*', 'google*'
              )
          )
          # Strip optional Cython/C .pyd extensions from pydantic v1 and websockets so they run 100% pure-Python
          for pkg in ('pydantic', 'websockets'):
              pkg_dir = dst / 'Lib' / 'site-packages' / pkg
              if pkg_dir.exists():
                  for pyd in pkg_dir.rglob('*.pyd'):
                      pyd.unlink(missing_ok=True)
          print('Bundled DigiCert-signed Python runtime into', dst)
          "

      - name: Bundle Python Local AI Backend with PyInstaller (macOS Single-Binary for Clean Bundle Signing)
        if: runner.os == 'macOS'
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onefile --name wisp-backend --distpath backend-dist/wisp-backend --workpath backend-build --paths backend --exclude-module pytest --exclude-module unittest --exclude-module tkinter --exclude-module sklearn --exclude-module scipy --exclude-module sherpa_onnx --exclude-module torch --exclude-module torchvision --exclude-module torchaudio --exclude-module tensorflow --exclude-module matplotlib --exclude-module pandas --collect-all onnxruntime --collect-all sentencepiece --collect-all tokenizers --collect-all soundfile --collect-all soundcard --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on backend/main.py
          chmod +x backend-dist/wisp-backend/wisp-backend
          codesign --force --sign - backend-dist/wisp-backend/wisp-backend

      - name: Bundle Python Local AI Backend with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onedir --contents-directory _i --name wisp-backend --distpath backend-dist --workpath backend-build --paths backend --exclude-module pytest --exclude-module unittest --exclude-module tkinter --exclude-module sklearn --exclude-module scipy --exclude-module sherpa_onnx --exclude-module torch --exclude-module torchvision --exclude-module torchaudio --exclude-module tensorflow --exclude-module matplotlib --exclude-module pandas --collect-all onnxruntime --collect-all sentencepiece --collect-all tokenizers --collect-all soundfile --collect-all soundcard --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on backend/main.py
          python -c "import pathlib, shutil; [shutil.rmtree(p, ignore_errors=True) for p in pathlib.Path('backend-dist').rglob('tests') if p.is_dir()]"

      - name: Install Frontend & Electron Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend & Package Desktop Executables
        working-directory: frontend
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}
        run: npm run ${{ matrix.dist_script }}

      - name: Verify macOS App Bundle Signature & Smoke-Test Embedded Backend
        if: runner.os == 'macOS'
        run: |
          APP_BUNDLE=$(find frontend/release -maxdepth 2 -name "WispAI.app" | head -n 1)
          echo "Verifying strict macOS signature on: $APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          echo "Smoke-testing embedded macOS backend binary..."
          "$APP_BUNDLE/Contents/Resources/backend-dist/wisp-backend/wisp-backend" &
          BACKEND_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/api/config > /dev/null; then
              echo "macOS embedded backend responded on http://127.0.0.1:8765/api/config !"
              kill "$BACKEND_PID" || true
              exit 0
            fi
            sleep 1
          done
          kill "$BACKEND_PID" || true
          echo "ERROR: macOS embedded backend failed to respond within 20s"
          exit 1

      - name: Check SignPath Code Signing Configuration (Windows)
        id: signpath_config
        if: runner.os == 'Windows'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID || vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "SignPath code signing is configured and enabled."
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "SignPath secrets not configured yet — skipping remote code signing."
          }

      - name: Upload Unsigned Windows Executables for SignPath
        id: upload_unsigned_win
        if: runner.os == 'Windows' && steps.signpath_config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-executables
          path: |
            frontend/release/*.exe
            frontend/release/*.zip

      - name: Sign Windows Executables with SignPath.io
        if: runner.os == 'Windows' && steps.signpath_config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID || vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG || vars.SIGNPATH_PROJECT_SLUG || 'wisp' }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG || vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload_unsigned_win.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: frontend/release

      - name: Upload Built Executables Artifact (${{ matrix.platform_name }})
        uses: actions/upload-artifact@v4
        with:
          name: Wisp-${{ matrix.platform_name }}
          path: |
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/*.deb
            frontend/release/*.rpm
            frontend/release/*.AppImage
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build-desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Wisp-*
          path: release-assets

      - name: Clean up previous releases and stale assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for rel_tag in $(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName -q '.[].tagName'); do
            gh release delete "$rel_tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          done

      - name: Create or Update GitHub Release with Windows, macOS, Ubuntu & Fedora Installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('WispAI {0}', github.ref_name) || 'WispAI v1.0.0 (Latest Build)' }}
          body: |
            ### WispAI — 100% Offline Local AI Meeting Transcriber & Translator
            Download the package for your operating system below:
            - **Windows (Portable ZIP):** `WispAI-1.0.0-win.zip` (Unzip and run `WispAI.exe` directly — ready to run, no installer required)
            - **macOS (Apple Silicon):** `WispAI-1.0.0-arm64.dmg` or `WispAI-1.0.0-arm64-mac.zip`
            - **Linux (Ubuntu / Debian):** `wisp-desktop_1.0.0_amd64.deb` or `WispAI-1.0.0.AppImage`
            - **Linux (Fedora / Red Hat):** `wisp-desktop-1.0.0.x86_64.rpm`
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage

      - name: Check Microsoft Store Auto-Publish Credentials
        id: msstore_config
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          if [ -n "$MSSTORE_TENANT_ID" ] && [ -n "$MSSTORE_CLIENT_ID" ] && [ -n "$MSSTORE_CLIENT_SECRET" ] && [ -n "$MSSTORE_SELLER_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Microsoft Store credentials found — automatic Store submission enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Microsoft Store API secrets not configured yet — skipping automatic Store submission."
          fi

      - name: Set up Microsoft Store CLI
        if: steps.msstore_config.outputs.enabled == 'true'
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Microsoft Store CLI & Publish .appx Package
        if: steps.msstore_config.outputs.enabled == 'true'
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID || vars.MSSTORE_PRODUCT_ID }}
        run: |
          msstore reconfigure \
            --tenantId "$MSSTORE_TENANT_ID" \
            --clientId "$MSSTORE_CLIENT_ID" \
            --clientSecret "$MSSTORE_CLIENT_SECRET" \
            --sellerId "$MSSTORE_SELLER_ID"
          APPX_FILE=$(find release-assets -name "*.appx" | head -n 1)
          echo "Publishing $APPX_FILE to Microsoft Store..."
          if [ -n "$MSSTORE_PRODUCT_ID" ]; then
            msstore publish "$APPX_FILE" --id "$MSSTORE_PRODUCT_ID"
          else
            msstore publish "$APPX_FILE"
          fi
